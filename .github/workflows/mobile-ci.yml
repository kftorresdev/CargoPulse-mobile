name: CargoPulse Mobile CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Unit Test Suite (.NET MAUI 9)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET MAUI Android Workload
        run: |
          dotnet workload install android

      - name: Restore NuGet Packages
        run: |
          dotnet restore CargoPulse.Mobile.sln

      - name: Run Fast Unit Tests (No Emulator)
        run: |
          dotnet test test/CargoPulse.Mobile.Tests/CargoPulse.Mobile.Tests.csproj --configuration Release --verbosity normal

      - name: Build Android App (net9.0-android)
        run: |
          dotnet build src/CargoPulse.Mobile.csproj -f net9.0-android -c Release

      - name: Archive Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CargoPulse-Mobile-Android-Artifacts
          path: src/bin/Release/net9.0-android/*.aab
          if-no-files-found: ignore
